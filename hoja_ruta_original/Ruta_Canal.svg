<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1640" viewBox="0 0 1240 1640" role="img">
  <title>Búsqueda progresiva de P-04 Canal</title>
  <desc>Ramas de investigación, requisitos comunes y criterio delimitado de agotamiento. Nada en este mapa declara una realización obtenida.</desc>
  <rect width="1240" height="1640" fill="#f7f9fc" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63778b" />
    </marker>
  </defs>
  <text x="55" y="58" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#102e4a" font-weight="700" text-anchor="start">
    <tspan x="55" dy="0">B · Buscar una realización de Canal</tspan>
  </text>
  <text x="55" y="91" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#263749" font-weight="400" text-anchor="start">
    <tspan x="55" dy="0">Agotar mecanismos razonables de M2 antes de introducir física nueva.</tspan>
  </text>
  <rect x="300" y="128" width="640" height="109" rx="15" fill="#eaf0fa" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="320" y="157" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#46637f" font-weight="600" text-anchor="start">
    <tspan x="320" dy="0">C0</tspan>
  </text>
  <text x="320" y="186" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#102e4a" font-weight="600" text-anchor="start">
    <tspan x="320" dy="0">Contrato y teoremas de exclusión</tspan>
  </text>
  <text x="320" y="213" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#41556b" font-weight="400" text-anchor="start">
    <tspan x="320" dy="0">Cambiar una hipótesis física; no repetir el mismo tubo.</tspan>
  </text>
  <path d="M620 237 L620 272" fill="none" stroke="#63778b" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="95" y="272" width="1050" height="148" rx="15" fill="#e7f3f1" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="115" y="301" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#46637f" font-weight="600" text-anchor="start">
    <tspan x="115" dy="0">C1–C4 · CRIBADO ESTACIONARIO</tspan>
  </text>
  <text x="115" y="330" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#102e4a" font-weight="600" text-anchor="start">
    <tspan x="115" dy="0">Ramas, corriente, vorticidad y capas</tspan>
  </text>
  <text x="115" y="357" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#41556b" font-weight="400" text-anchor="start">
    <tspan x="115" dy="0">Otras ramas radiales; flujo temporal/espacial; momento angular; tubos huecos y mediador.</tspan>
    <tspan x="115" dy="21">Existencia y espectro radial, longitudinal y azimutal.</tspan>
    <tspan x="115" dy="21">Descartar clases cubiertas por un argumento analítico auditado.</tspan>
  </text>
  <path d="M620 420 L620 455" fill="none" stroke="#63778b" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="95" y="455" width="1050" height="128" rx="15" fill="#e7f3f1" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="115" y="484" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#46637f" font-weight="600" text-anchor="start">
    <tspan x="115" dy="0">C5–C7 · CAMBIAR LA ESTRUCTURA</tspan>
  </text>
  <text x="115" y="513" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#102e4a" font-weight="600" text-anchor="start">
    <tspan x="115" dy="0">Modulación, geometría y soluciones compuestas</tspan>
  </text>
  <text x="115" y="540" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#41556b" font-weight="400" text-anchor="start">
    <tspan x="115" dy="0">Fondos periódicos y Bloch; segmentos/anillos/superficies; cadenas de Q-balls.</tspan>
    <tspan x="115" dy="21">Estabilidad del conjunto, transporte y soporte realmente emergente.</tspan>
  </text>
  <path d="M620 583 L620 618" fill="none" stroke="#63778b" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="95" y="618" width="1050" height="128" rx="15" fill="#e7f3f1" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="115" y="647" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#46637f" font-weight="600" text-anchor="start">
    <tspan x="115" dy="0">C8 · ÚLTIMA RAMA DE RECURSOS EXISTENTES</tspan>
  </text>
  <text x="115" y="676" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#102e4a" font-weight="600" text-anchor="start">
    <tspan x="115" dy="0">Dinámica y control físicamente derivados</tspan>
  </text>
  <text x="115" y="703" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#41556b" font-weight="400" text-anchor="start">
    <tspan x="115" dy="0">Órbitas y Floquet; fuente, sensor, actuador, ruido, saturación y coste.</tspan>
    <tspan x="115" dy="21">Si requiere materia, declarar su dependencia del sector interactuante.</tspan>
  </text>
  <path d="M620 746 L620 780" fill="none" stroke="#63778b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M1145 346 L1180 346 L1180 832 L1145 832" fill="none" stroke="#63778b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5" />
  <path d="M1145 520 L1180 520" fill="none" stroke="#63778b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5" />
  <text x="1140" y="253" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#46637f" font-weight="400" text-anchor="end">
    <tspan x="1140" dy="0">Con candidato: acceso directo a la puerta</tspan>
  </text>
  <rect x="95" y="780" width="1050" height="109" rx="15" fill="#dcebea" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="115" y="809" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#46637f" font-weight="600" text-anchor="start">
    <tspan x="115" dy="0">PUERTA · EN CUANTO EXISTA UN CANDIDATO</tspan>
  </text>
  <text x="115" y="838" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#102e4a" font-weight="600" text-anchor="start">
    <tspan x="115" dy="0">Región estable y función transportadora</tspan>
  </text>
  <text x="115" y="865" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#41556b" font-weight="400" text-anchor="start">
    <tspan x="115" dy="0">Pasar a los extremos; no esperar a completar todas las variantes.</tspan>
  </text>
  <path d="M620 889 L620 924" fill="none" stroke="#63778b" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="95" y="924" width="1050" height="128" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="115" y="953" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#46637f" font-weight="600" text-anchor="start">
    <tspan x="115" dy="0">C9</tspan>
  </text>
  <text x="115" y="982" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#102e4a" font-weight="600" text-anchor="start">
    <tspan x="115" dy="0">Extremo, fuente, receptor y empalmes</tspan>
  </text>
  <text x="115" y="1009" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#41556b" font-weight="400" text-anchor="start">
    <tspan x="115" dy="0">Resolver el fondo completo y su espectro; calcular reflexión, transmisión y radiación.</tspan>
    <tspan x="115" dy="21">Neumann ideal y absorción numérica no sustituyen un terminal físico.</tspan>
  </text>
  <path d="M620 1052 L620 1087" fill="none" stroke="#63778b" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="95" y="1087" width="1050" height="128" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="115" y="1116" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#46637f" font-weight="600" text-anchor="start">
    <tspan x="115" dy="0">C10</tspan>
  </text>
  <text x="115" y="1145" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#102e4a" font-weight="600" text-anchor="start">
    <tspan x="115" dy="0">Preparar, operar, probar fallos y apagar</tspan>
  </text>
  <text x="115" y="1172" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#41556b" font-weight="400" text-anchor="start">
    <tspan x="115" dy="0">22 requisitos en una región robusta; potencia, pérdidas, ruido y balances completos.</tspan>
    <tspan x="115" dy="21">Comparación con R1 histórico y revisión explícita de prestaciones.</tspan>
  </text>
  <path d="M620 1215 L620 1240 L327 1240 L327 1280" fill="none" stroke="#63778b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M620 1215 L620 1240 L915 1240 L915 1280" fill="none" stroke="#63778b" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="75" y="1280" width="505" height="148" rx="15" fill="#dcebea" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="95" y="1309" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#46637f" font-weight="600" text-anchor="start">
    <tspan x="95" dy="0">SI SUPERA TODAS LAS PUERTAS</tspan>
  </text>
  <text x="95" y="1338" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#102e4a" font-weight="600" text-anchor="start">
    <tspan x="95" dy="0">P-04 admitido en su dominio</tspan>
  </text>
  <text x="95" y="1365" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#41556b" font-weight="400" text-anchor="start">
    <tspan x="95" dy="0">Expediente de E08 y nivel de evidencia.</tspan>
    <tspan x="95" dy="21">Después: Distribuidor, Retardo y Puente.</tspan>
    <tspan x="95" dy="21">No extrapolar a cualquier escala.</tspan>
  </text>
  <rect x="655" y="1280" width="505" height="148" rx="15" fill="#fff1dc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="675" y="1309" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#46637f" font-weight="600" text-anchor="start">
    <tspan x="675" dy="0">SI FALLAN LAS CLASES RAZONABLES</tspan>
  </text>
  <text x="675" y="1338" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#102e4a" font-weight="600" text-anchor="start">
    <tspan x="675" dy="0">Agotamiento delimitado</tspan>
  </text>
  <text x="675" y="1365" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#41556b" font-weight="400" text-anchor="start">
    <tspan x="675" dy="0">Registrar negativos y preguntas aún abiertas.</tspan>
    <tspan x="675" dy="21">Completar M2 interactuante antes de elegir M3.</tspan>
    <tspan x="675" dy="21">Una laguna computacional no es refutación.</tspan>
  </text>
  <text x="75" y="1500" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#263749" font-weight="400" text-anchor="start">
    <tspan x="75" dy="0">Cada fallo cierra sólo su realización o clase demostrada.</tspan>
    <tspan x="75" dy="25.56">Un enlace transitorio o por relevos requiere un contrato diferente de una guía larga estable.</tspan>
  </text>
  <text x="75" y="1588" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#41556b" font-weight="400" text-anchor="start">
    <tspan x="75" dy="0">La Q-ball y la ruta de Reserva continúan en paralelo, aunque Canal cambie de teoría.</tspan>
  </text>
</svg>
name: CP12 frontera original verificada

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: number

permissions:
  contents: write

jobs:
  frontera:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ciencia/cp12-causal-chi
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          architecture: x64
      - name: Instalar el compilador original desde el archivo firmado de Ubuntu
        run: |
          sudo tee /tmp/cp12-snapshot.list >/dev/null <<'APT'
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://snapshot.ubuntu.com/ubuntu/20250101T000000Z noble main
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://snapshot.ubuntu.com/ubuntu/20250101T000000Z noble-updates main
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://snapshot.ubuntu.com/ubuntu/20250101T000000Z noble-security main
          APT
          APT_OPTIONS=(-o Dir::Etc::sourcelist=/tmp/cp12-snapshot.list -o Dir::Etc::sourceparts=- -o Acquire::Languages=none -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false)
          sudo apt-get "${APT_OPTIONS[@]}" update
          sudo apt-get "${APT_OPTIONS[@]}" install -y --allow-downgrades \
            gcc-13=13.3.0-6ubuntu2~24.04 \
            gcc-13-x86-64-linux-gnu=13.3.0-6ubuntu2~24.04 \
            cpp-13=13.3.0-6ubuntu2~24.04 \
            cpp-13-x86-64-linux-gnu=13.3.0-6ubuntu2~24.04 \
            gcc-13-base=13.3.0-6ubuntu2~24.04 \
            libgcc-13-dev=13.3.0-6ubuntu2~24.04 \
            g++-13=13.3.0-6ubuntu2~24.04 \
            g++-13-x86-64-linux-gnu=13.3.0-6ubuntu2~24.04 \
            libstdc++-13-dev=13.3.0-6ubuntu2~24.04
          cc --version
      - name: Dependencias originales
        run: python -m pip install -r requirements.txt
      - name: Exigir identidad original antes de actuar
        run: python trazabilidad/CP12_reconstruccion/verificar_entorno_durable.py
      - name: Verificar traslado con cero pasos M2
        if: inputs.target == -1
        run: python trazabilidad/CP12_reconstruccion/continuar_en_Git_CP12.py --check-handoff
      - name: Ejecutar sólo la frontera original y conservarla antes de avanzar
        if: inputs.target > 0
        run: python trazabilidad/CP12_reconstruccion/continuar_en_Git_CP12.py --target ${{ inputs.target }}
      - name: Interpretar el presupuesto con el prerregistro existente
        if: inputs.target == 0
        run: python trazabilidad/CP12_reconstruccion/continuar_en_Git_CP12.py --interpret
      - name: Conservar diagnóstico operativo adicional
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CP12-frontera-${{ inputs.target }}-${{ github.run_id }}
          path: |
            trazabilidad/CP12_reconstruccion/entorno_durable/GitHub_${{ github.run_id }}.json
            trazabilidad/CP12_reconstruccion/incidentes/GitHub_${{ github.run_id }}_*/
          if-no-files-found: warn

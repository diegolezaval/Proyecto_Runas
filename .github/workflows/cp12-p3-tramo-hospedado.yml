name: CP12 P3 tramo hospedado

on:
  workflow_call:
    inputs:
      objetivo:
        required: true
        type: number

permissions:
  contents: write

jobs:
  tramo:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        candidato: [1, 2, 3, 4, 5, 6]
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GIT_TERMINAL_PROMPT: '0'
      P3_OBJETIVO: ${{ inputs.objetivo }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          sparse-checkout: herramientas
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          architecture: x64
      - name: Validar que el ejecutor reproduce BLAS del protocolo
        id: entorno
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 threadpoolctl==3.6.0
          python - <<'PY'
          import os
          import numpy, scipy.linalg
          from threadpoolctl import threadpool_info
          dispatch = threadpool_info()
          compatible = bool(dispatch) and all(d['architecture'] == 'SkylakeX' and d['num_threads'] == 1 for d in dispatch)
          print({'compatible': compatible, 'architectures': [d['architecture'] for d in dispatch]})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('compatible=' + str(compatible).lower() + '\n')
          PY
      - name: Restaurar y ejecutar el tramo con supervisión
        if: steps.entorno.outputs.compatible == 'true'
        run: |
          python -m pip install matplotlib==3.10.8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python herramientas/reanudar_cp12.py hospedado retomar \
            --objetivo "$P3_OBJETIVO" --trabajo "$RUNNER_TEMP/cp12-p3"

  constatar:
    needs: tramo
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      P3_OBJETIVO: ${{ inputs.objetivo }}
    steps:
      - name: Comprobar que GitHub conserva el checkpoint exigido
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/checkpoints/CP12/p3_20261018/ESTADO_REANUDACION.json?ref=ciencia%2Fcp12-residuo-p3-20261018" --jq '.content' |
            base64 -d > estado.json
          python3 - <<'PY'
          import os, json
          from pathlib import Path
          state = json.loads(Path('estado.json').read_bytes())
          proof = state['latest_full_frontier_proof']
          if (proof['observer_clock'] < int(os.environ['P3_OBJETIVO']) or not proof['passed'] or
                  not proof['all_five_spatial_and_physical_gates_passed'] or
                  proof['M2_steps_executed_during_recovery_and_metrics'] != 0):
              raise SystemExit('GitHub todavía no contiene la frontera verificada de este tramo.')
          print(proof['recovery_receipt'])
          PY

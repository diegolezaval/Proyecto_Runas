name: P3 infraestructura - comprobar BLAS sin M2

on:
  push:
    branches: [ciencia/cp12-residuo-p3-20261018]
    paths:
      - .github/workflows/p3-infraestructura-20261028.yml

permissions:
  contents: read

concurrency:
  group: p3-infraestructura-20261028
  cancel-in-progress: false

jobs:
  comprobar-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          architecture: x64
      - name: Instalar las dos dependencias del control original
        run: python -m pip install numpy==2.3.5 threadpoolctl==3.6.0
      - name: Exigir dispatch original sin forzarlo ni usar M2
        run: |
          python -c "import os; assert not os.environ.get('OPENBLAS_CORETYPE'), 'No se permite forzar el dispatch BLAS'"
          python trazabilidad/CP12_reconstruccion/comprobar_dispatch_original.py
      - name: Conservar únicamente el resultado de esta ejecución
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P3-dispatch-sin-M2-${{ github.run_id }}-${{ github.run_attempt }}
          path: trazabilidad/CP12_reconstruccion/entorno_durable/dispatch_GitHub_${{ github.run_id }}_${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 90

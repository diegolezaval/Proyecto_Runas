name: Publicar CP11 integrado y verificado
on:
  push:
    branches: [publicacion/cp11]
    paths: [.github/workflows/publicar-cp11.yml, publicacion/CP11/**]
permissions:
  contents: write
concurrency:
  group: publicacion-cp11
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_TERMINAL_PROMPT: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Recuperar herramientas de esta publicación
        run: |
          set -euo pipefail
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' clone --depth 1 --single-branch --branch publicacion/cp11 "https://github.com/${GITHUB_REPOSITORY}.git" tooling
          test "$(git -C tooling rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Preparar Python de empaquetado
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Preparar compresión de referencia
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://zlib.net/fossils/zlib-1.3.2.tar.gz --output zlib-1.3.2.tar.gz
          printf '%s\n' 'bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16  zlib-1.3.2.tar.gz' | sha256sum --check
          tar -xzf zlib-1.3.2.tar.gz
          cd zlib-1.3.2
          ./configure --prefix="$RUNNER_TEMP/cp11-zlib"
          make -j2
          make install
      - name: Verificar main, reconstruir ZIP y publicar tag y Release
        run: |
          set -euo pipefail
          LD_LIBRARY_PATH="$RUNNER_TEMP/cp11-zlib/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" python tooling/publicacion/CP11/publicar_CP11.py
      - name: Conservar acta de publicación
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acta-publicacion-CP11
          path: acta_final_CP11
          if-no-files-found: ignore

name: Comprobar entorno y clon remoto de CP10

on:
  push:
    branches: [migration/cp10]
    paths: [.github/workflows/migrar-cp10.yml]

permissions:
  contents: write

concurrency:
  group: migracion-cp10
  cancel-in-progress: false

jobs:
  importar-y-verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      CP10_BOOTSTRAP_COMMIT: 436fb01ac4656171da31603a306587d6cba559f9
      GIT_TERMINAL_PROMPT: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
    steps:
      - name: Preparar Python de referencia para la verificación remota
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Obtener sólo las herramientas de la rama auxiliar
        shell: bash
        run: |
          git -c credential.helper= -c credential.helper='!gh auth git-credential' clone --branch migration/cp10 --single-branch https://github.com/diegolezaval/Proyecto_Runas.git tooling
          test "$(git -C tooling rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Importar, clonar desde GitHub, comprobar CP10 y publicar su ZIP original
        shell: bash
        run: python tooling/migration/preparar_clon_referencia_CP10.py

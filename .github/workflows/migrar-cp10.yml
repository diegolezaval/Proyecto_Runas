name: Publicar CP10 con clon científico ya verificado

on:
  push:
    branches: [migration/cp10]
    paths: [.github/workflows/migrar-cp10.yml]

permissions:
  contents: write

concurrency:
  group: migracion-cp10
  cancel-in-progress: false

jobs:
  publicar-checkpoint-verificado:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_TERMINAL_PROMPT: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Obtener la evidencia y las herramientas de la rama auxiliar
        shell: bash
        run: |
          git -c credential.helper= -c credential.helper='!gh auth git-credential' clone --branch migration/cp10 --single-branch https://github.com/diegolezaval/Proyecto_Runas.git tooling
          test "$(git -C tooling rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validar recibos, publicar CP10 y verificar descargas reales de su ZIP
        run: python tooling/migration/publicar_CP10_verificado.py
      - name: Conservar también el acta final como artefacto privado
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CP10-acta-final
          path: acta_final_CP10/*.json
          if-no-files-found: error
          retention-days: 90

name: CP12 P4 referencia Galerkin
on:
  push:
    branches: [administracion/cp12-p4-referencia-galerkin]
    paths: [herramientas/cp12_galerkin/ACTIVAR.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: cp12-p4-referencia-0504f26a56f91b820ffa7a77d917582b
  cancel-in-progress: false
jobs:
  preparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      phase: ${{ steps.fase.outputs.phase }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: herramientas/cp12_galerkin
      - id: fase
        run: |
          jq -r '"phase=" + (.phase | select(. == "preflight" or . == "production"))' herramientas/cp12_galerkin/ACTIVAR.json >> "$GITHUB_OUTPUT"
  controles:
    needs: preparar
    if: needs.preparar.outputs.phase == 'preflight'
    uses: ./.github/workflows/cp12-p4-galerkin-tramo.yml
    with:
      fase: preflight
      objetivo: 0
      casos: '["controles"]'
  evolucion_008:
    needs: preparar
    if: needs.preparar.outputs.phase == 'production'
    uses: ./.github/workflows/cp12-p4-galerkin-tramo.yml
    with:
      fase: tramo
      objetivo: 8
  comparacion_008:
    needs: evolucion_008
    uses: ./.github/workflows/cp12-p4-galerkin-tramo.yml
    with:
      fase: comparar
      objetivo: 8
      casos: '["lectura"]'
  evolucion_040:
    needs: comparacion_008
    uses: ./.github/workflows/cp12-p4-galerkin-tramo.yml
    with:
      fase: tramo
      objetivo: 40
  comparacion_040:
    needs: evolucion_040
    uses: ./.github/workflows/cp12-p4-galerkin-tramo.yml
    with:
      fase: comparar
      objetivo: 40
      casos: '["lectura"]'
  evolucion_080:
    needs: comparacion_040
    uses: ./.github/workflows/cp12-p4-galerkin-tramo.yml
    with:
      fase: tramo
      objetivo: 80
  comparacion_080:
    needs: evolucion_080
    uses: ./.github/workflows/cp12-p4-galerkin-tramo.yml
    with:
      fase: comparar
      objetivo: 80
      casos: '["lectura"]'
  evolucion_120:
    needs: comparacion_080
    uses: ./.github/workflows/cp12-p4-galerkin-tramo.yml
    with:
      fase: tramo
      objetivo: 120
  comparacion_120:
    needs: evolucion_120
    uses: ./.github/workflows/cp12-p4-galerkin-tramo.yml
    with:
      fase: comparar
      objetivo: 120
      casos: '["lectura"]'
  evolucion_160:
    needs: comparacion_120
    uses: ./.github/workflows/cp12-p4-galerkin-tramo.yml
    with:
      fase: tramo
      objetivo: 160
  comparacion_160:
    needs: evolucion_160
    uses: ./.github/workflows/cp12-p4-galerkin-tramo.yml
    with:
      fase: comparar
      objetivo: 160
      casos: '["lectura"]'

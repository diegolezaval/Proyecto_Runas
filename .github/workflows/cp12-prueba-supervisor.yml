name: CP12 prueba hospedada del supervisor

on:
  push:
    branches: [administracion/cp12-reanudacion]
    paths:
      - .github/workflows/cp12-prueba-supervisor.yml

permissions:
  contents: read

jobs:
  observar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          sparse-checkout: herramientas/cp12_reanudacion
      - name: Publicar la salida y simular la pérdida del entorno
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 -m cp12_reanudacion.prueba_hospedada observar
        working-directory: herramientas

  recuperar:
    needs: observar
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: herramientas/cp12_reanudacion
      - name: Recuperar el recibo en otro ejecutor y comprobar el contacto perdido
        run: python3 -m cp12_reanudacion.prueba_hospedada recuperar
        working-directory: herramientas

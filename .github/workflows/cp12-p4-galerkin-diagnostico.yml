name: CP12 P4 Galerkin diagnóstico de etapas
on:
  push:
    branches: [administracion/cp12-p4-referencia-galerkin]
    paths: [herramientas/cp12_galerkin/DIAGNOSTICO_ETAPAS.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: cp12-p4-galerkin-diagnostico-0504f26a56f91b820ffa7a77d917582b
  cancel-in-progress: false
jobs:
  diagnostico:
    name: Etapas EPS sobre estado congelado
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CP12_CANDIDATE: P4
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          sparse-checkout: herramientas
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          architecture: x64
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 threadpoolctl==3.6.0 matplotlib==3.10.8
      - name: Verificar el negativo y resolver etapas sin avanzar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          export PYTHONPATH="$PWD/herramientas:$PWD/herramientas/cp12_galerkin"
          python herramientas/cp12_galerkin/diagnostico_etapas.py --work "$RUNNER_TEMP/cp12-galerkin-diagnostico"

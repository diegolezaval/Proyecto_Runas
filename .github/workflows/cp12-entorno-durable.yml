name: CP12 entorno durable sin pasos M2

on:
  push:
    branches: [ciencia/cp12-causal-chi]
    paths:
      - .github/workflows/cp12-entorno-durable.yml
      - trazabilidad/CP12_reconstruccion/verificar_entorno_durable.py

permissions:
  contents: read

concurrency:
  group: cp12-entorno-durable
  cancel-in-progress: false

jobs:
  entorno:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          architecture: x64
      - name: Dependencias originales
        run: python -m pip install -r requirements.txt
      - name: Exigir dispatch BLAS original con cero pasos M2
        run: python trazabilidad/CP12_reconstruccion/comprobar_dispatch_original.py
      - name: Instalar el compilador original desde el archivo firmado de Ubuntu
        run: |
          sudo tee /tmp/cp12-snapshot.list >/dev/null <<'APT'
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://snapshot.ubuntu.com/ubuntu/20250101T000000Z noble main
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://snapshot.ubuntu.com/ubuntu/20250101T000000Z noble-updates main
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://snapshot.ubuntu.com/ubuntu/20250101T000000Z noble-security main
          APT
          APT_OPTIONS=(-o Dir::Etc::sourcelist=/tmp/cp12-snapshot.list -o Dir::Etc::sourceparts=- -o Acquire::Languages=none -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false)
          sudo apt-get "${APT_OPTIONS[@]}" update
          sudo apt-get "${APT_OPTIONS[@]}" install -y --allow-downgrades \
            gcc-13=13.3.0-6ubuntu2~24.04 \
            gcc-13-x86-64-linux-gnu=13.3.0-6ubuntu2~24.04 \
            cpp-13=13.3.0-6ubuntu2~24.04 \
            cpp-13-x86-64-linux-gnu=13.3.0-6ubuntu2~24.04 \
            gcc-13-base=13.3.0-6ubuntu2~24.04 \
            libgcc-13-dev=13.3.0-6ubuntu2~24.04 \
            g++-13=13.3.0-6ubuntu2~24.04 \
            g++-13-x86-64-linux-gnu=13.3.0-6ubuntu2~24.04 \
            libstdc++-13-dev=13.3.0-6ubuntu2~24.04
          cc --version
      - name: Verificar identidad completa sin evolucionar
        run: python trazabilidad/CP12_reconstruccion/verificar_entorno_durable.py
      - name: Conservar la comprobación incluso si falla
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CP12-entorno-durable-${{ github.run_attempt }}
          path: |
            trazabilidad/CP12_reconstruccion/entorno_durable/dispatch_GitHub_${{ github.run_id }}_${{ github.run_attempt }}.json
            trazabilidad/CP12_reconstruccion/entorno_durable/GitHub_${{ github.run_id }}_${{ github.run_attempt }}.json
          if-no-files-found: warn
